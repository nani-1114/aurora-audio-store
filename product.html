<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product | Aurora Audio</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
</head>
<body data-page="product">
  <header class="site-header">
    <a href="index.html" class="logo">Aurora<span>Audio</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="index.html#shop">Shop</a>
      <a href="checkout.html" class="nav-cart">
        Cart
        <span class="header-cart-count" id="header-cart-count" hidden>0</span>
      </a>
      <a href="index.html#contact" class="nav-cta">Contact</a>
    </nav>
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main id="product-main" class="product-page-main">
    <p class="loading-msg" id="loading">Loading product…</p>
    <p class="error-msg" id="product-error" hidden>Product not found. <a href="index.html">Back to shop</a></p>

    <section id="product" class="product-hero" hidden>
      <div class="gallery">
        <figure class="main-image-wrap">
          <img id="main-image" src="" alt="" width="800" height="800" />
        </figure>
        <div class="thumbnails" id="thumbnails" aria-label="Product images"></div>
      </div>

      <div class="product-info">
        <p class="badge" id="product-badge" hidden></p>
        <p class="product-category" id="product-category"></p>
        <h1 class="product-name" id="product-name"></h1>

        <div class="product-rating-block" id="product-rating-block" aria-label="Product rating"></div>

        <p class="product-description" id="product-description"></p>
        <div class="price-block">
          <span class="price" id="price"></span>
          <span class="price-old" id="price-old" hidden></span>
        </div>

        <div class="color-picker" id="color-picker-wrap" hidden aria-label="Choose color">
          <span class="label">Color</span>
          <div class="colors" id="color-swatches"></div>
          <span class="color-name" id="color-name"></span>
        </div>

        <div class="quantity-row">
          <label for="quantity">Quantity</label>
          <div class="quantity-control">
            <button type="button" id="qty-minus" aria-label="Decrease quantity">−</button>
            <input type="number" id="quantity" value="1" min="1" max="99" aria-label="Quantity" />
            <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <div class="cta-group">
          <button type="button" class="btn btn-primary" id="buy-now">Buy Now</button>
          <button type="button" class="btn btn-secondary" id="add-to-cart">Add to Cart</button>
        </div>
        <a href="index.html#shop" class="learn-more">← Back to all products</a>
      </div>
    </section>

    <section id="product-details" class="product-details-section" hidden>
      <h2>About this product</h2>
      <p class="product-long-desc" id="product-long-desc"></p>
      <h3>Key features</h3>
      <ul class="product-features" id="product-features"></ul>
    </section>

    <section id="product-reviews-section" class="product-reviews-section" hidden>
      <div class="product-reviews-head">
        <h2>Ratings &amp; reviews</h2>
        <div class="product-reviews-summary" id="product-reviews-summary"></div>
      </div>
      <div class="review-cards" id="product-review-cards"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="copyright">© 2026 Aurora Audio</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product-page.js"></script>
</body>
</html>
